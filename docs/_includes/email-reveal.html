<div class="speaking-email" data-speaking-email data-speaking-email-revealed="false">
  <button class="btn btn--primary speaking-email__reveal" type="button" aria-controls="speaking-email-details" aria-label="Show email address" aria-pressed="false" title="Show email address" data-speaking-email-reveal>
    <i class="fas fa-envelope" aria-hidden="true"></i>
    <span class="speaking-email__button-label" data-speaking-email-reveal-label>Show Email</span>
  </button>
  <div class="speaking-email__details" id="speaking-email-details" data-speaking-email-details>
    <span class="speaking-email__address" aria-label="Email address hidden" aria-live="polite" data-speaking-email-address>Email address hidden</span>
    <button class="btn btn--primary speaking-email__copy" type="button" aria-label="Copy email address" title="Copy email address" data-speaking-email-copy disabled>
      <i class="fas fa-copy" aria-hidden="true"></i>
      <span class="speaking-email__button-label" data-speaking-email-copy-label>Copy</span>
    </button>
    <span class="speaking-email__status" role="status" aria-live="polite" data-speaking-email-status></span>
  </div>
</div>
