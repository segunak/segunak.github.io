  Segun Akinyemi is a Nigerian American writer, speaker, educator, and Senior Software Engineer at [Microsoft](https://en.wikipedia.org/wiki/Microsoft) known for explaining complex topics in a practical, down-to-earth way. Based in [Charlotte](https://en.wikipedia.org/wiki/Charlotte,_North_Carolina), he founded [Discovery Days](https://aka.ms/discovery-day/flyer), a local field trip program connecting students with STEM opportunities, created and maintains [Charlotte Third Places](https://www.charlottethirdplaces.com/), and was named to the [2025 Charlotte Business Journal 40 Under 40](https://segunakinyemi.com/blog/cbj-40-under-40/) list at age 28. Learn more at [segunak.com](https://segunakinyemi.com/about/).

long: |-
  Segun Akinyemi is a Nigerian American, writer, speaker, educator, and Senior Software Engineer at [Microsoft](https://en.wikipedia.org/wiki/Microsoft) known for explaining complex topics in a practical, down-to-earth way. Born in [Seattle](https://en.wikipedia.org/wiki/Seattle), educated in [St. Louis](https://en.wikipedia.org/wiki/St._Louis), and now based in [Charlotte](https://en.wikipedia.org/wiki/Charlotte,_North_Carolina), he connects people with knowledge, community, and opportunity through technology.

  At heart, he loves education and creating approachable learning experiences, deepening his own understanding along the way. Grounded in his [Christian faith](https://segunakinyemi.com/blog/comforts-of-christ/), he founded [Discovery Days](https://aka.ms/discovery-day/flyer), a field trip program connecting local students with STEM opportunities, and built [Charlotte Third Places](https://www.charlottethirdplaces.com/), a guide to welcoming community spaces around the city. These efforts contributed to his recognition on the [2025 Charlotte Business Journal 40 Under 40](https://segunakinyemi.com/blog/cbj-40-under-40/) list at age 28.

  At Microsoft and beyond, he writes, speaks, and teaches about [AI-assisted software engineering](https://segunakinyemi.com/blog/coding-is-dead-software-engineering-isnt/), helping students and professionals learn alongside these tools while keeping humans in the loop. Outside of work, some of his favorite pursuits include [reading](https://segunakinyemi.com/library/), [blogging](https://segunakinyemi.com/blog/), spending time at [third places](https://www.charlottethirdplaces.com/), searching for the [best cinnamon rolls](https://segunakinyemi.com/tags/#dough-diaries), exploring science fiction and fantasy, and watching anime ([*Steins;Gate*](https://en.wikipedia.org/wiki/Steins;Gate_(TV_series)) remains his all time favorite). Learn more at [segunak.com](https://segunakinyemi.com/about/).
