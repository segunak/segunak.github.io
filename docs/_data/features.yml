# Speaking page external-evidence schema.
#
# Properties:
# - type: Required. One of `embed`, `feature`, `testimonial`, or `mention`.
# - featured: Optional boolean. `true` shows the item in the initial grid;
#   `false` or omission keeps it in the View More dialog. Featured items are
#   not repeated in the dialog. Defaults to `false`.
# - url: Required. Absolute source URL. An `embed` URL must be a LinkedIn post
#   containing an `activity` or `ugcPost` ID.
# - height: Optional integer for `embed` only. Iframe height in pixels; defaults
#   to 560.
# - quote: Required Markdown for `testimonial` only. Exact source excerpt.
# - context: Optional Markdown for `testimonial` only. Stable attribution.
# - note: Optional Markdown for `embed` and `testimonial`, and required for
#   `mention`. Short supporting context shown in an attached caption band.
# - title: Required plain text for `feature` only.
# - source: Required plain text publisher or organization for `feature` only.
# - description: Optional Markdown summary for `feature` only.
# - image: Optional local or absolute image URL for `feature` only.
# - image_alt: Required plain text when a `feature` has `image`.
# - embed_url: Optional verified media-player URL for `feature` only. Use instead
#   of `image` when the source provides a dedicated iframe player.
# - action_label: Optional plain text for `feature` only; defaults to View Source.
# A `feature` must provide exactly one visual mode: `image` or `embed_url`.
# Use only the properties supported by the selected type.
#
# `embed`: Use when the complete LinkedIn post is relevant.
# - type: embed
#   featured: true
#   url: https://www.linkedin.com/posts/example-activity-1234567890123456789-example/
#   height: 640
#
# `feature`: Use for a whole external article, profile, or embeddable video.
# - type: feature
#   featured: true
#   url: https://example.com/article
#   title: Example Feature
#   source: Example Publisher
#   description: A concise **Markdown** summary.
#   image: /assets/images/misc/example.jpg
#   image_alt: Description of the preview image
#   action_label: Read Article
# - type: feature
#   url: https://example.com/video
#   title: Example Video Feature
#   source: Example Station
#   embed_url: https://example.com/video/player
#   action_label: Watch Video
#
# `testimonial`: Use when only a short excerpt of a longer source is relevant.
# - type: testimonial
#   url: https://www.linkedin.com/posts/example-activity-1234567890123456789-example/
#   quote: Exact excerpt with **bold text**.
#   context: [Example Conference](https://example.com/) Attendee
#
# `mention`: Use for compact LinkedIn evidence that should not be embedded.
# - type: mention
#   url: https://www.linkedin.com/posts/example-activity-1234567890123456789-example/
#   note: Organization's [recap](https://example.com/) of my workshop

