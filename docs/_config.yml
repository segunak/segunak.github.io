# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
# There is no single schema because Jekyll also permits custom variables. Configuration authorities:
# Jekyll core: https://jekyllrb.com/docs/configuration/options/
# Minimal Mistakes: https://mmistakes.github.io/minimal-mistakes/docs/configuration/
# Jekyll SEO Tag: https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.\
# Font Awesome Icons: Uses the same jsDelivr @latest loader as Minimal Mistakes.
# 
# Emojis can be used in posts and pages by using the jemoji plugin.
# See: https://github.com/ikatyang/emoji-cheat-sheet for the shortcodes. 
# For example, :smile: will render as 😄. Or you can actually just use the 
# emoji, but that doesn't guarantee that it will render properly on all devices. 
# The jemoji plugin will convert the emoji to an image for better compatibility.
#
# To build this site (and not serve) bundle exec jekyll build

title: Segun Akinyemi
name: Segun Akinyemi
subtitle:
masthead_title:
search: true
email:
breadcrumbs: false  # disabled by default
#logo: "/assets/images/misc/logo-fullytransparent.png"
locale: "en-US"
tagline: "The personal blog of Segun Akinyemi"
description: "The personal website, blog and digital playground of Segun Akinyemi."
twitter:
  username: segunofsolace
repository: segunak/segunak.github.io

# See https://github.com/mmistakes/minimal-mistakes/discussions/2033 for the code/ideas. This is a part of adding
# a light/dark switch button to the page. Two themes can be toggled.
# See https://mmistakes.github.io/minimal-mistakes/docs/configuration/#skin for what the below options look like.
#"default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"
minimal_mistakes_skin: air
minimal_mistakes_skin2: neon

# For pages that don't have a header.image assigned in their YAML Front Matter, 
# site.og_image (OG is open graph) will be used as a fallback. Use your logo, icon, 
# avatar or something else that is meaningful. Just make sure it is placed in the 
# /assets/images/misc/ folder, has a minimum size of 120px by 120px, and is less than 1MB in file size.
og_image: /assets/images/misc/space.jpg
teaser: /assets/images/misc/coolcityscape.jpg # Default teaser for all posts. Can be overridden per post.
head_scripts:
  - /assets/js/social-thumbnails.js

domain: segunakinyemi.com        # if you want to force HTTPS, specify the domain without the http at the start, e.g. example.com
url: https://segunakinyemi.com   # the base hostname and protocol for your site, e.g. http://example.com
#baseurl: /somefolder # place folder name if the site is served in a subfolder

social:
  type: Person # Person or Organization (defaults to Person)
  name: Segun Akinyemi # If the user or organization name differs from the site's name
  links:
    - "https://segunakinyemi.com"
    - "https://www.linkedin.com/in/segunakinyemi"
    - "https://www.youtube.com/@segun.akinyemi"
    - "https://twitter.com/segunofsolace"
    - "https://github.com/segunak"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-DKVCNPN7DF"
    anonymize_ip: true # default

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 7 # amount of posts to show
paginate_path: /blog/page:num/
timezone: America/New_York # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Removed as disqus started injecting adds into comment plugins.
# Comment options at https://mmistakes.github.io/minimal-mistakes/docs/configuration/#comments
# comments:
#   provider: "disqus"
#   disqus:
#     shortname: "segunsanguine"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-seo-tag
  - jemoji

author:
  name   : "Segun Akinyemi"
  avatar : "/assets/images/misc/bitmoji-square.png"
  bio    : "Christian, Software Engineer, Educator."
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/segunakinyemi/"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@segun.akinyemi"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/segunofsolace"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/segunak"
    - label: "Subscribe"
      icon: "fas fa-fw fa-envelope"
      url: "http://eepurl.com/itDfHE"

atom_feed:
  hide: true

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/segunakinyemi/"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@segun.akinyemi"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/segunofsolace"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/segunak"
    - label: "AI Transparency"
      icon: "fas fa-fw fa-robot"
      url: "/ai-transparency/"
    - label: "Feed"
      icon: "fas fa-fw fa-rss-square"
      url: "/feed.xml"

defaults:
  # _posts
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: single
      show_date: true
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc_label: "On This Page"
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      show_date: true
      author_profile: true
      read_time: false
      share: false
      related: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# When building locally this will open a webpage automatically showing you the content.
# open_url: true

include:
  - _pages


# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - .vscode/
  - .markdownlint.json
  - _misc/